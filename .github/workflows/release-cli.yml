name: CLI release

on:
  push:
    branches: ['release/cli-*']
    tags: ['cli-v*']
  pull_request:
    paths:
      - 'cmd/marionette/**'
      - 'client/**'
      - 'internal/adbrelay/**'
      - 'internal/direct/**'
      - 'internal/service/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/package-cli.py'
      - 'scripts/install-cli.*'
      - 'scripts/test-install-cli.*'
      - 'docs/CLI_INSTALL.md'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/marionette ./client ./internal/adbrelay ./internal/direct ./internal/service
      - run: go vet ./cmd/marionette ./client ./internal/adbrelay ./internal/direct ./internal/service
      - run: go run ./cmd/marionette --version

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build archives
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          if [[ "$GITHUB_REF" != refs/tags/cli-v* ]]; then version="dev-${GITHUB_SHA:0:12}"; fi
          python3 scripts/package-cli.py --version "$version"
          cd build/cli-release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: marionette-cli
          path: build/cli-release/*
          if-no-files-found: error

  install-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marionette-cli
          path: build/cli-release
      - name: Test macOS installation
        if: runner.os == 'macOS'
        run: sh scripts/test-install-cli.sh
      - name: Test Windows PowerShell 5.1 installation
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-install-cli.ps1

  publish:
    needs: [package, install-test]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marionette-cli
          path: build/cli-release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/cli-release/*.zip build/cli-release/install.sh build/cli-release/install.ps1 build/cli-release/SHA256SUMS
          --verify-tag --title "Marionette CLI ${GITHUB_REF_NAME#cli-}"
          --notes-file docs/CLI_RELEASE_NOTES.md --latest
